<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive course on every Istio, Kubernetes and cert-manager object needed for ingress and egress gateways, covering TCP, TLS and mTLS with annotated YAML.">
<title>Istio Ingress &amp; Egress</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a transit-map course. Fixed module rail on the left, one module at a time on the right.
   Encryption states are "lines" with fixed colors used in every diagram. */
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --surface-2: #E9EDF3;
  --ink: #131B2C;
  --ink-2: #374360;
  --muted: #5F6B84;
  --line: #D3DAE5;
  --accent: #2955BE;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1E8FA;

  --c-plain: #7A8498;
  --c-tls: #C27800;
  --c-mtls: #B4306C;
  --c-istio: #08857A;

  --f-istio: #2955BE;
  --f-k8s: #56637D;
  --f-cm: #2C8653;
  --f-install: #9C6224;
  --f-gwapi: #7449C2;

  --z-ing: #E4ECFB;  --z-ing-b: #B3C6EE;
  --z-egr: #EEE7FA;  --z-egr-b: #CDBDEB;
  --z-ten: #E2F2EB;  --z-ten-b: #AED8C4;
  --z-sys: #F5EEDF;  --z-sys-b: #DEC9A0;
  --z-cm:  #E5F2E8;  --z-cm-b:  #B2D6BC;
  --z-clu: #EBEDF1;  --z-clu-b: #C9CFDA;
  --z-ext: #F0F1F3;  --z-ext-b: #CBD0D8;

  --ok: #0D7A47;
  --bad: #B3261E;

  --code-bg: #0F1627;
  --code-line: #1D2740;
  --t-k: #93B5FF;
  --t-s: #F1C26B;
  --t-n: #7CDCCB;
  --t-c: #73809B;
  --t-p: #9BA7BE;
  --t-v: #E3E8F2;
  --t-hl: #23304F;

  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C111D; --surface: #131A2A; --surface-2: #1A2336; --ink: #E6EBF4; --ink-2: #C0C9DA; --muted: #8C98B0; --line: #283349;
    --accent: #7DA0FF; --accent-ink: #0C111D; --accent-soft: #1C2945;
    --c-plain: #8F99AD; --c-tls: #F0AC38; --c-mtls: #EE6EA7; --c-istio: #2CC2B0;
    --f-istio: #7DA0FF; --f-k8s: #98A5BE; --f-cm: #5CC487; --f-install: #DDA05E; --f-gwapi: #A889F0;
    --z-ing: #16223B; --z-ing-b: #2C4370; --z-egr: #201A36; --z-egr-b: #45386E; --z-ten: #12281F; --z-ten-b: #285843;
    --z-sys: #282214; --z-sys-b: #56482A; --z-cm: #132719; --z-cm-b: #2A5636; --z-clu: #181E2C; --z-clu-b: #343E54; --z-ext: #181C26; --z-ext-b: #343B4A;
    --ok: #4CC98A; --bad: #FF8A80;
    --code-bg: #0A0F1B; --code-line: #19223A; --t-hl: #1E2A47;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C111D; --surface: #131A2A; --surface-2: #1A2336; --ink: #E6EBF4; --ink-2: #C0C9DA; --muted: #8C98B0; --line: #283349;
  --accent: #7DA0FF; --accent-ink: #0C111D; --accent-soft: #1C2945;
  --c-plain: #8F99AD; --c-tls: #F0AC38; --c-mtls: #EE6EA7; --c-istio: #2CC2B0;
  --f-istio: #7DA0FF; --f-k8s: #98A5BE; --f-cm: #5CC487; --f-install: #DDA05E; --f-gwapi: #A889F0;
  --z-ing: #16223B; --z-ing-b: #2C4370; --z-egr: #201A36; --z-egr-b: #45386E; --z-ten: #12281F; --z-ten-b: #285843;
  --z-sys: #282214; --z-sys-b: #56482A; --z-cm: #132719; --z-cm-b: #2A5636; --z-clu: #181E2C; --z-clu-b: #343E54; --z-ext: #181C26; --z-ext-b: #343B4A;
  --ok: #4CC98A; --bad: #FF8A80;
  --code-bg: #0A0F1B; --code-line: #19223A; --t-hl: #1E2A47;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15.5px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code, .mono { font-family: var(--f-mono); font-size: 0.9em; }
p code, li code, td code, .lede code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; color: var(--ink); overflow-wrap: anywhere; }
a { color: var(--accent); }

.shell { display: grid; grid-template-columns: 284px minmax(0, 1fr); min-height: 100vh; }

/* ---------- Rail ---------- */
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 22px 14px 28px max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; flex-direction: column; gap: 4px; padding: 0 8px; }
.brand-mark { display: flex; gap: 5px; }
.brand-mark i { width: 22px; height: 6px; border-radius: 3px; display: block; }
.brand h2 { font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: 19px; line-height: 1.15; margin: 8px 0 0; letter-spacing: -0.01em; }
.brand p { margin: 0; color: var(--muted); font-size: 13px; }
.progress { padding: 0 8px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--muted); }
.progress-bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.progress-bar i { display: block; height: 100%; background: var(--c-istio); width: 0; transition: width .4s; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-group h3 { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; padding: 0 8px; font-weight: 600; }
.nav-item { display: flex; align-items: center; gap: 10px; text-align: left; background: none; border: 0; border-radius: 8px; padding: 7px 8px; cursor: pointer; font-size: 14px; color: var(--ink-2); line-height: 1.3; }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.active { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.nav-item .tick { width: 16px; height: 16px; flex: none; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.nav-item.done .tick { background: var(--c-istio); border-color: var(--c-istio); }
.nav-item.done .tick::after { content: ""; width: 5px; height: 8px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.rail-toggle { display: none; }

/* ---------- Main ---------- */
main { min-width: 0; padding-block: 40px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.module { max-width: 1040px; margin: 0 auto; padding: 0 clamp(0px, 2vw, 24px); display: flex; flex-direction: column; gap: 44px; }
.module > section { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.kicker { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: var(--accent); margin: 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
h1 { font-family: var(--f-display); font-stretch: 110%; font-weight: 800; font-size: clamp(30px, 4.4vw, 46px); line-height: 1.06; letter-spacing: -0.015em; margin: 6px 0 0; text-wrap: balance; }
h2 { font-family: var(--f-display); font-stretch: 106%; font-weight: 750; font-size: 24px; line-height: 1.2; margin: 0; letter-spacing: -0.005em; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 700; font-size: 17px; margin: 0; line-height: 1.3; }
h4 { margin: 0; font-size: 13px; }
.lede { font-size: 17.5px; line-height: 1.6; color: var(--ink-2); max-width: 68ch; margin: 14px 0 0; }
.prose { max-width: 70ch; color: var(--ink-2); margin: 0; }
.prose + .prose { margin-top: -4px; }
.mod-head { display: flex; flex-direction: column; gap: 0; }
.keyidea { margin-top: 20px; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 18px; max-width: 820px; }
.keyidea b { font-family: var(--f-display); font-stretch: 112%; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.keyidea p { margin: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0; }
.grid { display: grid; gap: 14px; }
.grid.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.card h3 { margin-bottom: 6px; }
.card p { margin: 0 0 8px; color: var(--ink-2); font-size: 14.5px; }
.card ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 14.5px; }

.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--r); }
.figure { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.figure .scroll-x { border-radius: var(--r) var(--r) 0 0; }
.fig-foot { border-top: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 12.5px; color: var(--muted); align-items: center; }

/* Encryption legend */
.enc { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.enc i { width: 26px; height: 0; border-top: 4px solid; display: inline-block; border-radius: 2px; }
.enc.plain i { border-top: 3px dashed var(--c-plain); }
.enc.tls i { border-color: var(--c-tls); }
.enc.mtls i { border-top: 6px double var(--c-mtls); height: 0; }
.enc.istio i { border-color: var(--c-istio); }

/* Badges and chips */
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.badge.required { color: var(--ink); border-color: var(--ink-2); }
.badge.recommended { color: var(--accent); border-color: var(--accent); }
.badge.optional { border-style: dashed; }
.badge.platform { background: var(--z-ing); border-color: var(--z-ing-b); color: var(--ink-2); }
.badge.tenant { background: var(--z-ten); border-color: var(--z-ten-b); color: var(--ink-2); }
.badge.none { color: var(--muted); }
.ns { font-family: var(--f-mono); font-size: 12px; padding: 1px 7px; border-radius: 5px; border: 1px solid var(--z-clu-b); background: var(--z-clu); color: var(--ink-2); white-space: nowrap; }
.ns.ing { background: var(--z-ing); border-color: var(--z-ing-b); }
.ns.egr { background: var(--z-egr); border-color: var(--z-egr-b); }
.ns.ten { background: var(--z-ten); border-color: var(--z-ten-b); }
.ns.sys { background: var(--z-sys); border-color: var(--z-sys-b); }
.ns.cm { background: var(--z-cm); border-color: var(--z-cm-b); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 3px 9px 3px 7px; cursor: pointer; font-size: 12.5px; color: var(--ink); max-width: 100%; text-align: left; }
.chip:hover { border-color: var(--accent); }
.chip .dot, .dot { width: 8px; height: 8px; border-radius: 2px; flex: none; display: inline-block; }
.fam-istio { background: var(--f-istio); } .fam-k8s { background: var(--f-k8s); } .fam-cm { background: var(--f-cm); } .fam-install { background: var(--f-install); } .fam-gwapi { background: var(--f-gwapi); }
.chip .k { color: var(--muted); }
.chip .n { font-family: var(--f-mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .lbl { color: var(--muted); font-size: 11.5px; }

/* ---------- Overview map ---------- */
.map svg { display: block; width: 100%; min-width: 860px; height: auto; }
.map .zone rect { stroke-width: 1.2; }
.map text { font-family: var(--f-body); fill: var(--ink); }
.map .zlabel { font-family: var(--f-mono); font-size: 12px; fill: var(--ink-2); font-weight: 500; }
.map .pod rect { fill: var(--surface); stroke: var(--ink-2); stroke-width: 1.2; }
.map .pod text { font-size: 12.5px; font-weight: 600; }
.map .pod .s { font-size: 10.5px; font-weight: 400; fill: var(--muted); }
.map .route { cursor: pointer; }
.map .route path { fill: none; stroke-linecap: round; transition: stroke-width .15s, opacity .15s; }
.map:hover .route { opacity: .45; }
.map .route:hover, .map .route:focus { opacity: 1; }
.map .route:hover path.w { stroke-width: 7; }
.map .cfg { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 2 4; }
.map .cfgl { font-size: 11px; fill: var(--muted); }

/* SVG line styles shared by map and flows */
.l-plain { stroke: var(--c-plain); stroke-width: 3.5; stroke-dasharray: 7 6; }
.l-tls { stroke: var(--c-tls); stroke-width: 4.5; }
.l-mtls { stroke: var(--c-mtls); stroke-width: 7; }
.l-mtls-in { stroke: var(--surface); stroke-width: 2; }
.l-istio { stroke: var(--c-istio); stroke-width: 4.5; }

/* ---------- Flow (wire view) ---------- */
.flow svg { display: block; width: 100%; min-width: 760px; height: auto; }
.flow text { font-family: var(--f-body); fill: var(--ink); }
.flow .fnode rect { stroke-width: 1.4; transition: stroke-width .2s; }
.flow .fnode { cursor: pointer; }
.flow .fnode .t { font-weight: 700; font-size: 14px; }
.flow .fnode .s { font-size: 11.5px; fill: var(--muted); }
.flow .fnode.on rect.box { stroke: var(--accent); stroke-width: 3; }
.flow .hop { transition: opacity .3s; }
.flow .hop.ahead { opacity: .3; }
.flow .hop path { fill: none; stroke-linecap: round; }
.flow .hlabel { font-size: 12px; fill: var(--ink-2); font-weight: 500; }
.flow .lead { stroke: var(--line); stroke-width: 1.2; }
.flow .track { stroke: var(--line); stroke-width: 2; }
.flow .packet { transition: transform .7s cubic-bezier(.6,.05,.25,1); }
.flow .packet circle { fill: var(--accent); stroke: var(--surface); stroke-width: 3; }
.flow-panel { border-top: 1px solid var(--line); padding: 16px 20px 18px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px 20px; align-items: start; }
.flow-panel h3 { font-size: 18px; }
.flow-panel .count { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.flow-panel p { margin: 6px 0 10px; color: var(--ink-2); max-width: 72ch; }
.flow-ctrls { display: flex; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }

/* ---------- Object map (graph) ---------- */
.graph svg { display: block; min-width: 100%; height: auto; }
.graph text { font-family: var(--f-body); }
.graph .lane { stroke-width: 1; }
.graph .lane-l { font-family: var(--f-mono); font-size: 12.5px; font-weight: 600; fill: var(--ink-2); }
.graph .lane-s { font-size: 11px; fill: var(--muted); }
.graph .node { cursor: pointer; }
.graph .node rect.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.3; transition: stroke .15s; }
.graph .node.optional rect.box { stroke-dasharray: 4 3; }
.graph .node .kind { font-size: 10.5px; fill: var(--muted); font-weight: 600; letter-spacing: .02em; }
.graph .node .nm { font-family: var(--f-mono); font-size: 11.5px; fill: var(--ink); }
.graph .node .tag { font-size: 9px; font-weight: 700; letter-spacing: .06em; fill: var(--muted); }
.graph .node.required .tag { fill: var(--ink-2); }
.graph .node.recommended .tag { fill: var(--accent); }
.graph .node:hover rect.box, .graph .node.on rect.box { stroke: var(--accent); }
.graph .node.sel rect.box { stroke: var(--accent); stroke-width: 2.6; }
.graph .edge { fill: none; stroke: var(--muted); stroke-width: 1.2; opacity: .38; marker-end: var(--mk); transition: opacity .15s; }
.graph .edge.on { stroke: var(--accent); opacity: 1; stroke-width: 2; marker-end: var(--mk-on); }
.graph svg.hot .node:not(.on):not(.sel) { opacity: .45; }
.graph svg.hot .edge:not(.on) { opacity: .12; }
.graph .el { display: none; pointer-events: none; }
.graph .el.on { display: inline; }
.graph .el rect { fill: var(--surface); stroke: var(--accent); stroke-width: 1; }
.graph .el text { font-size: 10.5px; fill: var(--ink); font-weight: 500; }

.module > .objwrap { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: start; }
.objlist { display: flex; flex-direction: column; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 32px); overflow-y: auto; padding-right: 4px; }
.objlist .grp { display: flex; flex-direction: column; gap: 3px; }
.objlist .grp > span { margin-bottom: 4px; align-self: flex-start; }
.ol-item { display: flex; align-items: center; gap: 8px; border: 1px solid transparent; background: none; border-radius: 7px; padding: 5px 8px; cursor: pointer; text-align: left; font-size: 13px; min-width: 0; }
.ol-item:hover { background: var(--surface); border-color: var(--line); }
.ol-item.sel { background: var(--surface); border-color: var(--accent); }
.ol-item .txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.ol-item .txt small { color: var(--muted); font-size: 11px; }
.ol-item .txt span { font-family: var(--f-mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.detail { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.d-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.d-head h3 { font-family: var(--f-mono); font-size: 19px; font-weight: 600; overflow-wrap: anywhere; }
.d-kind { font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; display: inline-flex; gap: 7px; align-items: center; }
.d-api { color: var(--muted); font-family: var(--f-mono); font-size: 12px; }
.d-block { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 6px 16px; font-size: 14.5px; }
.d-block dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .07em; font-weight: 600; padding-top: 3px; }
.d-block dd { margin: 0; color: var(--ink-2); }

/* ---------- YAML viewer ---------- */
.yaml { background: var(--code-bg); border-radius: var(--r); overflow: hidden; color: var(--t-v); min-width: 0; }
.yaml-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px 8px 16px; border-bottom: 1px solid var(--code-line); font-family: var(--f-mono); font-size: 12px; color: var(--t-p); }
.yaml-bar button { background: transparent; border: 1px solid var(--code-line); color: var(--t-v); border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
.yaml-bar button:hover { border-color: var(--t-k); }
.yaml pre { margin: 0; padding: 12px 0; overflow-x: auto; font-family: var(--f-mono); font-size: 12.8px; line-height: 1.62; }
.yaml .ln { display: block; padding: 0 16px; white-space: pre; min-width: max-content; }
.yaml .ln.hl { background: var(--t-hl); }

  'foundation': { kicker: 'Platform · module 4', title: 'Mesh and gateway foundation', lede: 'Before any traffic flows, the platform team installs istiod, an ingress gateway in istio-ingress and an egress gateway in istio-egress. Each gateway is an ordinary Deployment and Service running Envoy, plus the RBAC it needs to read TLS Secrets.', key: 'A Gateway object never creates pods. It configures pods that already exist and carry the label it selects. Here that label is istio=ingressgateway or istio=egressgateway.' },
  'certs': { kicker: 'Platform · module 5', title: 'Certificates and Secrets', lede: 'cert-manager issues and renews certificates and writes them into Kubernetes Secrets. Istio gateways load those Secrets by name. What decides which namespace a Secret goes in is the component that holds the private key and does the TLS.', key: 'Whoever terminates or originates the TLS needs the Secret in its own namespace. Ingress SIMPLE and MUTUAL: istio-ingress. Passthrough: the app\'s namespace. Egress mTLS origination: istio-egress.' },

/* ------------------------------------------------------------ wire view */
function flowSVG(sc) {
  var f = sc.flow, W = 1000, n = f.nodes.length, m = 92, step = (W - 2 * m) / (n - 1), cy = 128, NW = 152, NH = 68;
  var s = '<svg viewBox="0 0 ' + W + ' 222" role="img" aria-label="Request path">';
  s += '<line class="track" x1="' + m + '" y1="' + (cy + 60) + '" x2="' + (W - m) + '" y2="' + (cy + 60) + '"/>';
  f.hops.forEach(function (h, i) {
    var x1 = m + i * step + NW / 2, x2 = m + (i + 1) * step - NW / 2, mid = (x1 + x2) / 2;
    var parts = h.label.split(' · ');
    s += '<g class="hop" data-h="' + i + '">';
    s += '<path class="l-' + h.enc + '" d="M' + x1 + ',' + cy + ' L' + x2 + ',' + cy + '"/>';
    if (h.enc === 'mtls') s += '<path class="l-mtls-in" d="M' + x1 + ',' + cy + ' L' + x2 + ',' + cy + '"/>';
    s += '<line class="lead" x1="' + mid + '" y1="' + (parts.length > 1 ? 58 : 44) + '" x2="' + mid + '" y2="' + (cy - 8) + '"/>';
    s += '<text class="hlabel" text-anchor="middle" x="' + mid + '" y="' + 30 + '">' + esc(parts[0]) + '</text>';
    if (parts[1]) s += '<text class="hlabel" text-anchor="middle" x="' + mid + '" y="' + 46 + '">' + esc(parts[1]) + '</text>';
    s += '</g>';
  });
  f.nodes.forEach(function (nd, i) {
    var cx = m + i * step;
    s += '<g class="fnode" data-i="' + i + '" tabindex="0" role="button" aria-label="' + esc(nd.label) + '"><rect class="box" x="' + (cx - NW / 2) + '" y="' + (cy - NH / 2) + '" width="' + NW + '" height="' + NH + '" rx="10" style="fill:var(--z-' + nd.zone + ');stroke:var(--z-' + nd.zone + '-b)"/>' +
      '<text class="t" text-anchor="middle" x="' + cx + '" y="' + (cy - 3) + '">' + esc(nd.label) + '</text>' +
      '<text class="s" text-anchor="middle" x="' + cx + '" y="' + (cy + 16) + '">' + esc(nd.sub) + '</text></g>';
  });
  s += '<g class="packet" transform="translate(' + m + ',' + (cy + 60) + ')"><circle r="9"/></g>';
  return s + '</svg>';
}
function initFlow(root, sc) {
  var f = sc.flow, steps = f.steps, i = 0, timer = null;
  var W = 1000, m = 92, step = (W - 2 * m) / (f.nodes.length - 1);
  var svg = $('.flow svg', root), pk = $('.packet', svg);
  var t = $('.fs-title', root), x = $('.fs-text', root), ob = $('.fs-objs', root), c = $('.fs-count', root);
  var prev = $('[data-flow="prev"]', root), next = $('[data-flow="next"]', root), play = $('[data-flow="play"]', root);
  function show(k) {
    i = Math.max(0, Math.min(steps.length - 1, k));
    var st = steps[i];
    pk.setAttribute('transform', 'translate(' + (m + st.node * step) + ',188)');
    $$('.fnode', svg).forEach(function (n) { n.classList.toggle('on', +n.getAttribute('data-i') === st.node); });
    $$('.hop', svg).forEach(function (h) { h.classList.toggle('ahead', +h.getAttribute('data-h') >= st.node); });
    c.textContent = 'Step ' + (i + 1) + ' of ' + steps.length;
    t.textContent = st.title; x.textContent = st.text;
    ob.innerHTML = st.objs.length ? st.objs.map(function (id) { return chip(id); }).join('') : '<span class="legend-row">No cluster objects act on this step.</span>';
    prev.disabled = i === 0; next.disabled = i === steps.length - 1;
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; play.textContent = 'Play'; } }
  prev.addEventListener('click', function () { stop(); show(i - 1); });
  next.addEventListener('click', function () { stop(); show(i + 1); });
  play.addEventListener('click', function () {
    if (timer) { stop(); return; }
    if (i === steps.length - 1) show(0);
    play.textContent = 'Pause';
    timer = setInterval(function () { if (i >= steps.length - 1) { stop(); return; } show(i + 1); }, 3800);
  });
  $$('.fnode', svg).forEach(function (n) {
    var go = function () { stop(); var ni = +n.getAttribute('data-i'); for (var k = 0; k < steps.length; k++) if (steps[k].node === ni) { show(k); return; } };
    n.addEventListener('click', go);
    n.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
  show(0);
}

function updNav() {
  $$('.nav-item').forEach(function (b) { var id = b.getAttribute('data-go'); b.classList.toggle('done', done.indexOf(id) >= 0); b.classList.toggle('active', id === cur); });
  var n = MODULES.filter(function (m) { return done.indexOf(m.id) >= 0; }).length;
  $('#progressText').textContent = n + ' of ' + MODULES.length + ' modules complete';
  $('#progressBar').style.width = (n / MODULES.length * 100) + '%';
  var fb = $('#m-' + cur + ' [data-done]');
  if (fb) { var d = done.indexOf(cur) >= 0; fb.textContent = d ? 'Completed' : 'Mark module complete'; fb.classList.toggle('primary', !d); }
}
function footHTML(id) {
  var m = MOD[id], nx = MODULES[m.i + 1];
  return '<footer class="mod-foot"><button class="btn primary" data-done="' + id + '">Mark module complete</button>' +
    (nx ? '<div class="next"><small>Next · ' + esc(nx.group) + '</small><button class="btn" data-go="' + nx.id + '" data-markgo="' + id + '">' + esc(nx.title) + ' →</button></div>' : '') + '</footer>';
}
var cur = null;
function go(id) {
  if (!MOD[id]) id = 'overview';
  cur = id;
  var main = $('#main'), sec = $('#m-' + id);
  if (!sec) {
    sec = document.createElement('article'); sec.className = 'module'; sec.id = 'm-' + id;
    try { sec.innerHTML = RENDER[id]() + footHTML(id); if (INIT[id]) INIT[id](sec); }
    catch (err) { console.error(err); sec.innerHTML = '<p>This module failed to load: ' + esc(err.message) + '</p>'; }
    main.appendChild(sec);
  }
  $$('.module', main).forEach(function (s) { s.hidden = s !== sec; });
  if (location.hash.slice(1) !== id) { try { history.replaceState(null, '', '#' + id); } catch (e) { } }
  document.title = (id === 'overview' ? '' : MOD[id].title + ' · ') + 'Istio Ingress & Egress';
  window.scrollTo(0, 0);
  $('#rail').classList.remove('open'); $('#railToggle').setAttribute('aria-expanded', 'false');
  updNav();
}

/* modal */
function openModal(id) {
  $('#modalBody').innerHTML = objDetail(id, ALL_EDGES);
  $('#modal').hidden = false; $('#modalClose').focus();
}
function closeModal() { $('#modal').hidden = true; }
$('#modalClose').addEventListener('click', closeModal);
$('#modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });

function toast(msg) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 1800); }

/* global delegation */
document.addEventListener('click', function (e) {
  var g = e.target.closest('[data-go]');
  if (g) { if (g.hasAttribute('data-markgo')) markDone(g.getAttribute('data-markgo')); closeModal(); go(g.getAttribute('data-go')); return; }
  var d = e.target.closest('[data-done]');
  if (d) { var id = d.getAttribute('data-done'); var i = done.indexOf(id); if (i >= 0) done.splice(i, 1); else done.push(id); saveDone(); updNav(); return; }
  var c = e.target.closest('[data-copy]');
  if (c) {
    var txt = window.__yaml[c.getAttribute('data-copy')];
    var ok = function () { c.textContent = 'Copied'; setTimeout(function () { c.textContent = 'Copy YAML'; }, 1500); };
    var fallback = function () { var pre = c.closest('.yaml').querySelector('pre'); var r = document.createRange(); r.selectNodeContents(pre); var s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selected. Press Ctrl+C or Cmd+C to copy.'); };
    try { navigator.clipboard.writeText(txt).then(ok, fallback); } catch (er) { fallback(); }
    return;
  }
  var mk = e.target.closest('.mk');
  if (mk) { var y = mk.closest('.yaml'), li = $('[data-note-li="' + mk.getAttribute('data-note') + '"]', y); if (li) { li.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); li.classList.add('hl'); setTimeout(function () { li.classList.remove('hl'); }, 1600); } return; }
  var o = e.target.closest('[data-obj]');
  if (o) {
    var oid = o.getAttribute('data-obj'), modEl = o.closest('.module'), inModal = o.closest('#modal');
    var scId = modEl && modEl.id.slice(2);
    if (!inModal && scId && SC[scId] && SC[scId].objects.indexOf(oid) >= 0 && modEl.__select) { modEl.__select(oid, true); }
    else openModal(oid);
  }
});
document.addEventListener('mouseover', function (e) {
  var t = e.target.closest('.mk, .notes li, .ln[data-line]'); if (!t) return;
  var y = t.closest('.yaml'); var n = t.getAttribute('data-note') || t.getAttribute('data-note-li') || t.getAttribute('data-line');
  $$('.hl', y).forEach(function (x) { x.classList.remove('hl'); });
  $$('[data-line="' + n + '"], [data-note-li="' + n + '"]', y).forEach(function (x) { x.classList.add('hl'); });
});
document.addEventListener('mouseout', function (e) { var y = e.target.closest && e.target.closest('.yaml'); if (y && !y.contains(e.relatedTarget)) $$('.hl', y).forEach(function (x) { x.classList.remove('hl'); }); });
document.addEventListener('keydown', function (e) { var r = e.target.closest && e.target.closest('.route[data-go]'); if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); go(r.getAttribute('data-go')); } });

$('#railToggle').addEventListener('click', function () { var r = $('#rail'); var o = r.classList.toggle('open'); this.setAttribute('aria-expanded', o ? 'true' : 'false'); });
window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (h && h !== cur) go(h); });

renderNav();
go(location.hash.slice(1) || 'overview');
})();
</script>
</body>
</html>
